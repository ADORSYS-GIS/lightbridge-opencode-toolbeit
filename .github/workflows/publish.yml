name: Publish

# When this runs:
#   * On a GitHub Release being published — the common path. Tag the commit
#     you want to ship (e.g. `v0.2.0`), draft a release, hit "Publish release"
#     in the UI, and this workflow ships it.
#   * Manually via "Run workflow" — supports `dry_run: true` so you can
#     validate the full pipeline (verify + build + pack + verify tarball)
#     without actually pushing to npm.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip the actual npm publish (everything else still runs)"
        type: boolean
        default: false

# id-token: write is REQUIRED for npm provenance — it's how npm verifies the
# tarball was produced by this GitHub Actions workflow on this commit. See
# https://docs.npmjs.com/generating-provenance-statements
permissions:
  contents: read
  id-token: write

# Never run two publishes in parallel; allow them to queue rather than cancel.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # `release` events check out the tagged SHA, which is exactly what we
        # want — the tarball provenance attests the commit you tagged.

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@vymalo'
          always-auth: true

      - name: Publish preflight (every package, before anything is pushed)
        # Runs in dry-run too. For each published package: classify its version
        # on the registry, and for every one that still has to publish run the
        # npm Trusted Publishing OIDC exchange — the exact call pnpm makes before
        # its PUT, without the PUT. A missing Trusted Publisher, a name that was
        # never bootstrapped, or a hand-published version now fails the run here,
        # before a single package is published, instead of partway through.
        # See CLAUDE.md → Releasing → "Adding a new published package".
        run: node scripts/release/publish-guard.mjs preflight

      - name: Install (frozen lockfile)
        # Guarantees the installed tree exactly matches pnpm-lock.yaml — no
        # silent dependency drift between dev and the publish run.
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fail on high+ severity)
        # Hard-fail on high/critical CVEs. Moderate/low are tracked but don't
        # gate the release — moderate-severity Node CVEs are noisy.
        run: pnpm audit --audit-level=high --prod

      - name: Build all packages
        # Must run BEFORE typecheck/test: @vymalo/opencode-browser-mcp resolves
        # @vymalo/opencode-browser via its published "./lib" export
        # (dist/lib.d.ts), which doesn't exist on a clean runner until the
        # dependency is built. `pnpm -r` builds in topological order, so every
        # package's dist (incl. the Rolldown bundle, so a broken bundler is
        # still caught here) is in place before the recursive checks.
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Zip the browser extension (Chrome + Firefox)
        # The extension is private (not on npm) — it ships as zips attached to
        # the GitHub Release. `wxt zip` also emits a Firefox sources zip for AMO.
        run: |
          pnpm --filter @vymalo/opencode-browser-extension zip
          pnpm --filter @vymalo/opencode-browser-extension zip:firefox
          ls -la apps/browser-extension/.output/*.zip

      - name: Pack tarballs (all published packages)
        # One loop over the single package list in scripts/release/publish-guard.mjs
        # (PUBLISH_ORDER) — no per-package copy of the list to drift.
        run: |
          set -euo pipefail
          node scripts/release/publish-guard.mjs list | while read -r _dir name short; do
            mkdir -p "dist-tarball/${short}"
            pnpm --filter "${name}" pack --pack-destination "$PWD/dist-tarball/${short}" </dev/null
            ls -la "dist-tarball/${short}/"
          done

      - name: Verify tarball contents
        # Defense-in-depth: confirms each package is shipping its dist/, NOT
        # shipping source or tests, and that the package isn't accidentally
        # empty. Runs against every published tarball.
        run: |
          set -euo pipefail
          verify_tarball() {
            local tarball="$1"
            echo "=== Tarball: $tarball ==="
            # List once into a variable. We then match against the variable
            # with bash pattern matching — no pipes, no SIGPIPE, immune to
            # the `grep -q | pipefail` trap regardless of listing size.
            local entries
            entries=$(tar -tzf "$tarball")
            printf '%s\n' "$entries"
            echo
            echo "=== Validation: $tarball ==="
            # Wrap with newlines so a literal full-line match becomes a
            # simple substring search.
            local haystack=$'\n'"$entries"$'\n'
            if [[ "$haystack" != *$'\n'"package/dist/index.js"$'\n'* ]]; then
              echo "FAIL: package/dist/index.js missing from $tarball"
              exit 1
            fi
            if [[ "$haystack" =~ $'\n'package/(test|src|node_modules)/ ]]; then
              echo "FAIL: $tarball contains forbidden directories (test/src/node_modules)"
              echo "Offending entries:"
              printf '%s\n' "$entries" | grep -E '^package/(test|src|node_modules)/' || true
              exit 1
            fi
            if [[ "$haystack" != *$'\n'"package/LICENSE"$'\n'* ]]; then
              echo "FAIL: LICENSE missing from $tarball"
              exit 1
            fi
            echo "OK: $tarball"
          }

          expected=$(node scripts/release/publish-guard.mjs list | wc -l | tr -d ' ')
          found=$(ls dist-tarball/*/*.tgz | wc -l | tr -d ' ')
          if [ "$expected" != "$found" ]; then
            echo "FAIL: expected $expected tarballs (one per published package), found $found"
            exit 1
          fi

          for tarball in dist-tarball/*/*.tgz; do
            verify_tarball "$tarball"
          done

      - name: Publish to npm (ordered, with provenance)
        if: ${{ inputs.dry_run != true }}
        # One ordered loop over PUBLISH_ORDER (scripts/release/publish-guard.mjs):
        # dependencies first (auth-core, core-otel, provider-sync, then their
        # dependents, lightbridge last) because a published dependent's
        # workspace:* deps are rewritten to real versions that must already
        # exist on the registry.
        #
        # A package is SKIPPED only if its version on the registry carries a
        # provenance attestation from THIS repo's publish.yml. A version that
        # is on npm without that proof (a manual publish, another workflow)
        # fails the run instead of being reported as "already released" — the
        # old `npm view` skip hid a never-publishable provider-sync for two
        # months. The preflight step above already checked every package.
        #
        # --provenance:    signed SLSA attestation linking the tarball to this
        #                  workflow run + commit SHA; consumers verify it via
        #                  `npm audit signatures` or the npmjs.com package page.
        # --no-git-checks: release events check out a detached HEAD, which
        #                  pnpm's clean-branch guard would otherwise reject.
        # --access public: required for first publish under a new scope.
        run: node scripts/release/publish-guard.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MCP_NPM_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Dry-run notice
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "::notice::DRY RUN — skipped npm publish."
          echo "Tarball ready at: dist-tarball/"

      - name: Attach release artifacts to GitHub Release
        if: ${{ github.event_name == 'release' && inputs.dry_run != true }}
        uses: softprops/action-gh-release@v3
        with:
          # Three artifacts per release: the two npm package tarballs (for
          # inspection alongside npm) and the browser-extension zips (Chrome +
          # Firefox + Firefox sources) — the extension isn't on npm, so the
          # Release is its distribution channel.
          files: |
            dist-tarball/**/*.tgz
            apps/browser-extension/.output/*.zip

  # ---------------------------------------------------------------------------
  # Push the extension to the web stores. Separate job so a flaky store API
  # never rolls back the npm publish, and so store credentials stay isolated
  # from the npm token. Runs only after `publish` succeeds (we never submit an
  # extension build that didn't pass the full gate). Each store is gated on its
  # own credentials being present, so you can enable Chrome first and Firefox
  # later (or either alone) without the other failing the job.
  #
  # `wxt submit` wraps `publish-browser-extension`. Required repository secrets:
  #   Chrome Web Store — CHROME_EXTENSION_ID, CHROME_PUBLISHER_ID,
  #     CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL, CHROME_SERVICE_ACCOUNT_PRIVATE_KEY
  #     (CWS API v2, service-account JWT auth — the v1.1 OAuth-client flow
  #     shuts down 2026-10-15, see docs/browser.md)
  #   Firefox AMO      — FIREFOX_EXTENSION_ID, FIREFOX_JWT_ISSUER,
  #     FIREFOX_JWT_SECRET
  # See docs/browser.md → "Publishing the extension to the web stores".
  submit-extension:
    name: Submit extension to web stores
    runs-on: ubuntu-latest
    needs: publish
    # Also runnable via workflow_dispatch (honours dry_run → `wxt submit
    # --dry-run`, which validates credentials + zip without uploading).
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    env:
      # Mapped at job level so the per-store steps can branch on presence via
      # `if: env.* != ''` (secrets can't be referenced directly in `if:`).
      CHROME_API_VERSION: v2
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      # Empty on a real release; "--dry-run" on a dry-run dispatch. NO leading
      # "--" here. `pnpm run <script> <flag>` already forwards an
      # unrecognized flag straight through to the script with no separator
      # needed (verified: `pnpm run x --dry-run` gives the script argv
      # `['--dry-run']`). A leading "--" (the previous value here was
      # "-- --dry-run") forwards a LITERAL "--" token all the way to
      # `wxt submit`, which treats it as cac's end-of-flags marker -- so
      # "--dry-run" after it is read as a raw positional argument, never
      # parsed as the --dry-run flag, and the step proceeds to a REAL
      # upload + REAL "submit for review". This bug was dormant since this
      # workflow was first written: every dry-run attempt before 2026-07-31
      # failed at Chrome credential validation first, so nothing ever
      # reached the broken flag-parsing path -- the first time credentials
      # actually validated, it silently did a real submission instead of a
      # dry run.
      SUBMIT_ARGS: ${{ inputs.dry_run == true && '--dry-run' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Zip the browser extension (Chrome + Firefox)
        run: |
          pnpm --filter @vymalo/opencode-browser-extension zip
          pnpm --filter @vymalo/opencode-browser-extension zip:firefox
          ls -la apps/browser-extension/.output/*.zip

      - name: Submit to Chrome Web Store
        # Gated on the FULL Chrome credential set, not just the id — a partial
        # set would otherwise reach `wxt submit` and hard-fail the upload
        # instead of being skipped.
        if: ${{ env.CHROME_EXTENSION_ID != '' && env.CHROME_PUBLISHER_ID != '' && env.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL != '' && env.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY != '' }}
        run: pnpm --filter @vymalo/opencode-browser-extension run submit:chrome ${{ env.SUBMIT_ARGS }}

      - name: Submit to Firefox Add-ons (AMO)
        # Same: require the full Firefox credential set before attempting.
        if: ${{ env.FIREFOX_EXTENSION_ID != '' && env.FIREFOX_JWT_ISSUER != '' && env.FIREFOX_JWT_SECRET != '' }}
        run: pnpm --filter @vymalo/opencode-browser-extension run submit:firefox ${{ env.SUBMIT_ARGS }}

      - name: Warn on partial Chrome credentials
        # Surface the misconfiguration rather than silently skipping when an id
        # is present but the service account is incomplete.
        if: ${{ env.CHROME_EXTENSION_ID != '' && !(env.CHROME_PUBLISHER_ID != '' && env.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL != '' && env.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY != '') }}
        run: echo "::warning::CHROME_EXTENSION_ID is set but CHROME_PUBLISHER_ID/SERVICE_ACCOUNT_CLIENT_EMAIL/SERVICE_ACCOUNT_PRIVATE_KEY are incomplete — Chrome submission skipped."

      - name: Warn on partial Firefox credentials
        if: ${{ env.FIREFOX_EXTENSION_ID != '' && !(env.FIREFOX_JWT_ISSUER != '' && env.FIREFOX_JWT_SECRET != '') }}
        run: echo "::warning::FIREFOX_EXTENSION_ID is set but FIREFOX_JWT_ISSUER/SECRET are incomplete — Firefox submission skipped."

      - name: No stores configured
        if: ${{ env.CHROME_EXTENSION_ID == '' && env.FIREFOX_EXTENSION_ID == '' }}
        run: |
          echo "::notice::No store credentials set — skipped store submission."
          echo "Add CHROME_*/FIREFOX_* repo secrets to enable. See docs/browser.md."
