packages:
  - packages/*
  - apps/*

# Native build scripts that are allowed to run on install.
# esbuild is a vitest/vite transitive dep; msgpackr-extract is an optional
# msgpack speedup. Both are widely-used packages with reputable maintainers
# — keep this list minimal and audit before adding.
#
# pnpm 11 prefers the explicit `allowBuilds: <pkg>: true` shape over the
# legacy `onlyBuiltDependencies` array; the latter is silently ignored in
# `--frozen-lockfile` mode, which makes it look like local installs work
# while CI breaks.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  # spawn-sync (a transitive WXT/web-ext dep) ships a native build step we do
  # not need — the prebuilt JS works fine. Deny it.
  spawn-sync: false

minimumReleaseAgeExclude:
  - cronstrue@3.20.0
  # AI SDK v7 line (ai 7.x / @ai-sdk/* 4.x): freshly-published majors that trip
  # pnpm's release-freshness gate on publish age alone. DevDependencies only
  # (opencode-oauth2's e2e test) — the gate is noise here, same loose-mode
  # mechanism as cronstrue above.
  - '@ai-sdk/gateway@4.0.90'
  - '@ai-sdk/openai@4.0.73'
  - '@ai-sdk/provider-utils@5.0.46'
  - '@ai-sdk/provider@4.0.18'
  - ai@7.0.112

# Transitive dependencies pulled in through @modelcontextprotocol/sdk (by
# opencode-browser-mcp / opencode-devtools-mcp) that carry high-severity
# advisories and so trip the release workflow's `pnpm audit --audit-level=high`
# gate. Each entry pins to the first version that clears every advisory known
# against it — raise the floor rather than widening the range, and leave the
# advisory ids so the next person can tell whether an entry is still needed.
#
# fast-uri (via ajv, ajv-formats): host confusion via a userinfo `@`
# (GHSA-v2hh-gcrm-f6hx, GHSA-4c8g-83qw-93j6, fixed in 3.1.4) and then via a
# backslash authority introducer (GHSA-7p8r-x3mc-p8w7, fixed in 3.1.5). The
# earlier `^3.1.4` pin satisfied the first two and still resolved below the
# third's floor, so the gate failed again on the next release.
# Then a fourth round, and the same thing happened to `^3.1.5`: four more
# advisories all land on a 3.1.6 floor — SSRF via a percent-encoded scheme
# (GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf) and host confusion, one general
# (GHSA-jqff-g426-hqxp) and one via skipped IDN processing
# (GHSA-5jgf-p345-68v8). Hence `^3.1.6`. This package has now moved the floor
# three times in as many releases; if it does it again, consider whether the
# `@modelcontextprotocol/sdk` → `ajv` path can be dropped instead of chased.
#
# ip-address (via express-rate-limit): Address4 decodes leading-zero octets as
# decimal while resolvers read them as octal, allowing SSRF and a
# trust-boundary bypass (GHSA-mwp4-54f8-5fhr, fixed in 10.3.1).
# postcss / nanoid arrive through the vite + WXT toolchain (devDependencies
# only — they are not in any published tarball, but `pnpm audit` does not
# distinguish, and neither does the release gate). Both are pinned by range
# selector so the override applies to the vulnerable line without forcing a
# major on anything that legitimately wants a newer one.
#
# postcss: a `\r` in a source map URL escapes the comment context
# (GHSA-r28c-9q8g-f849, fixed in 8.5.18).
# nanoid: non-integer input silently produces predictable ids
# (GHSA-28wg-ghj8-5hjv, fixed in 3.3.16) and a pool-reuse collision
# (GHSA-2v37-7h3g-55p8, fixed in 3.3.18).
#
# toml: TWO advisories with DIFFERENT floors — prototype pollution
# (GHSA-v5mp-jgw5-2x6j, fixed in 4.1.2) and uncontrolled recursion
# (GHSA-82x6-q7mm-w9cf, fixed in 4.2.0). The floor is the HIGHER of the two:
# `^4.1.2` would clear the first, still resolve below the second, and fail this
# same gate on the next release — exactly how `fast-uri`'s `^3.1.4` pin failed
# above. Hence `^4.2.0`.
# CURRENTLY INERT: the path this pin guarded (`@opencode-ai/plugin` →
# `effect@4.0.0-beta.83` → `toml`) was removed by the v2 cutover (ADR-0019);
# `effect@4.1.0` has no dependencies and `toml` is absent from the lockfile.
# Kept as a floor in case a future dependency reintroduces `toml`.
#
# Round three — the release audit gate failed again after the v2 cutover, with
# 1 critical + 8 high. The direct `@modelcontextprotocol/sdk` bump to ^1.32.2
# (browser-mcp, devtools-mcp) clears the SDK's own four advisories (floors
# 1.30.1, 1.31.0, 1.32.0, 1.32.0 — the HIGHEST, 1.32.0, binds), but the SDK's
# express / zod ranges still resolve below the following fixes, so these are
# pinned here. All are version-scoped to lift only the vulnerable range.
#
# proxy-addr: CRITICAL, IP spoofing via IPv4-mapped IPv6
# (GHSA-jqcg-44mw-7w3h, vulnerable >=1.1.0 <2.0.8, fixed in 2.0.8). Reached via
# sdk > express > proxy-addr and sdk > express-rate-limit > express > proxy-addr.
# body-parser: DoS via trailing bytes after a compressed request body
# (GHSA-27r3-jxmh-p828, vulnerable >=2.0.0 <2.4.0, fixed in 2.4.0). Same two
# express paths.
# zod: memory exhaustion validating oversized constrained collections
# (GHSA-mrhx-c7xc-m3w5, vulnerable <4.6.6, fixed in 4.6.6). Reached via
# sdk > zod and sdk > zod-to-json-schema > zod.
#
# vite / source-map-js are NOT production dependencies of this suite. vite is a
# devDependency of the workspace packages, and `@opencode/plugin@2.2.6` lists
# it only as an OPTIONAL peer (peerDependenciesMeta), with no vite in its
# `dependencies`. pnpm resolves that optional peer from the workspace's
# devDependency and records `@opencode/plugin` peer variants in the graph, so
# `pnpm audit --prod` still reports vite and, through postcss, source-map-js
# (path printed: @opencode/plugin>vite>postcss>source-map-js) even though no
# published tarball installs them. These overrides exist because the release
# gate reads that output and must pass, not because the plugin API pins vite.
# vite: launch-editor `fs.existsSync()` existence check can be bypassed on
# Windows (GHSA-587h-7wmj-h5pm, vulnerable >=8.3.0 <=8.3.2, fixed in 8.3.3).
# The range selector stops at the 8.x line so no other vite major is dragged up.
# source-map-js (via @opencode/plugin > vite > postcss): event-loop DoS through
# indexed source-map section offsets (GHSA-68fv-2mgg-jv7q, vulnerable
# >=1.0.0 <1.2.2, fixed in 1.2.2).
# Each advisory has a single fixed version today, so each floor is that fixed
# version; if a second advisory lands on one of these, raise to the HIGHER floor
# (see fast-uri / toml above) rather than adding a parallel entry.
overrides:
  fast-uri: ^3.1.6
  toml: ^4.2.0
  ip-address: ^10.3.1
  postcss@<8.5.18: ^8.5.18
  nanoid@<3.3.18: ^3.3.18
  proxy-addr@<2.0.8: ^2.0.8
  body-parser@<2.4.0: ^2.4.0
  zod: ^4.6.6
  vite@>=8.3.0 <8.3.3: ^8.3.3
  source-map-js@<1.2.2: ^1.2.2
