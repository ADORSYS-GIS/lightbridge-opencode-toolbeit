packages:
  - packages/*
  - apps/*

# Native build scripts that are allowed to run on install.
# esbuild is a vitest/vite transitive dep; msgpackr-extract is an optional
# msgpack speedup. Both are widely-used packages with reputable maintainers
# — keep this list minimal and audit before adding.
#
# pnpm 11 prefers the explicit `allowBuilds: <pkg>: true` shape over the
# legacy `onlyBuiltDependencies` array; the latter is silently ignored in
# `--frozen-lockfile` mode, which makes it look like local installs work
# while CI breaks.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  # tree-sitter + grammar ship a node-gyp native build (used by
  # @vymalo/opencode-code-index to parse source into a symbol graph).
  # @duckdb/node-api ships prebuilt binaries (no build step), so it is not listed.
  tree-sitter: true
  tree-sitter-typescript: true
  # tree-sitter-typescript depends on the JS grammar (also a node-gyp build).
  tree-sitter-javascript: true
  # spawn-sync (a transitive WXT/web-ext dep) ships a native build step we do
  # not need — the prebuilt JS works fine. Deny it.
  spawn-sync: false
  # @swc/core's postinstall selects the right prebuilt platform binary
  # (@swc/core-<platform>-<arch>, all published by the same swc-project org)
  # — no compilation happens on the consumer's machine.
  '@swc/core': true

minimumReleaseAgeExclude:
  - cronstrue@3.20.0

# Transitive dependencies pulled in through @modelcontextprotocol/sdk (by
# opencode-browser-mcp / opencode-devtools-mcp) that carry high-severity
# advisories and so trip the release workflow's `pnpm audit --audit-level=high`
# gate. Each entry pins to the first version that clears every advisory known
# against it — raise the floor rather than widening the range, and leave the
# advisory ids so the next person can tell whether an entry is still needed.
#
# fast-uri (via ajv, ajv-formats): host confusion via a userinfo `@`
# (GHSA-v2hh-gcrm-f6hx, GHSA-4c8g-83qw-93j6, fixed in 3.1.4) and then via a
# backslash authority introducer (GHSA-7p8r-x3mc-p8w7, fixed in 3.1.5). The
# earlier `^3.1.4` pin satisfied the first two and still resolved below the
# third's floor, so the gate failed again on the next release.
#
# ip-address (via express-rate-limit): Address4 decodes leading-zero octets as
# decimal while resolvers read them as octal, allowing SSRF and a
# trust-boundary bypass (GHSA-mwp4-54f8-5fhr, fixed in 10.3.1).
# postcss / nanoid arrive through the vite + WXT toolchain (devDependencies
# only — they are not in any published tarball, but `pnpm audit` does not
# distinguish, and neither does the release gate). Both are pinned by range
# selector so the override applies to the vulnerable line without forcing a
# major on anything that legitimately wants a newer one.
#
# postcss: a `\r` in a source map URL escapes the comment context
# (GHSA-r28c-9q8g-f849, fixed in 8.5.18).
# nanoid: non-integer input silently produces predictable ids
# (GHSA-28wg-ghj8-5hjv, fixed in 3.3.16) and a pool-reuse collision
# (GHSA-2v37-7h3g-55p8, fixed in 3.3.18).
overrides:
  fast-uri: ^3.1.5
  ip-address: ^10.3.1
  postcss@<8.5.18: ^8.5.18
  nanoid@<3.3.18: ^3.3.18
